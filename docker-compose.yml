services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aegis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aegis_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles:
      - full

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: aegis-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - aegis_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    profiles:
      - full

  aegis-server:
    build:
      context: .
      dockerfile: Dockerfile.build
    container_name: aegis-server
    user: "0:0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEGIS_Database__Provider: PostgreSQL
      AEGIS_Database__ConnectionString: ${AEGIS_DB_CONNECTION_STRING}
      AEGIS_Database__ZoneTreePath: ${AEGIS_ZONETREE_PATH:-/data/zonetree/messages-db}
      AEGIS_Redis__ConnectionString: ${AEGIS_REDIS_CONNECTION_STRING:-redis:6379}
      AEGIS_AvatarStorage__Provider: MinIO
      AEGIS_AvatarStorage__BaseDirectory: /data/media/avatars
      AEGIS_AvatarStorage__PublicBaseUrl: ${AEGIS_AVATAR_PUBLIC_BASE_URL:-http://localhost:9000/aegis-media/avatars}
      AEGIS_AvatarStorage__MaxUploadBytes: "5242880"
      AEGIS_AvatarStorage__MaxWidth: "512"
      AEGIS_AvatarStorage__MaxHeight: "512"
      AEGIS_Minio__Enabled: ${AEGIS_MINIO_ENABLED:-true}
      AEGIS_Minio__Endpoint: ${AEGIS_MINIO_ENDPOINT:-minio:9000}
      AEGIS_Minio__UseSsl: "false"
      AEGIS_Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      AEGIS_Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AEGIS_Minio__Bucket: ${AEGIS_MINIO_BUCKET:-aegis-media}
      AEGIS_Minio__PublicBaseUrl: ${AEGIS_MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      AEGIS_Elasticsearch__Enabled: ${AEGIS_ELASTICSEARCH_ENABLED:-true}
      AEGIS_Elasticsearch__Endpoint: ${AEGIS_ELASTICSEARCH_ENDPOINT:-http://elasticsearch:9200}
      AEGIS_Elasticsearch__IndexName: ${AEGIS_ELASTICSEARCH_INDEX:-aegis-users}
      AEGIS_Security__TotpEncryptionKey: ${AEGIS_Security__TotpEncryptionKey:-}
      AEGIS_Logging__Console: "true"
      AEGIS_Logging__File: "false"
      AEGIS_ProtocolSecurity__RequireEncryptedPayloadAfterHandshake: ${AEGIS_REQUIRE_ENCRYPTED_PAYLOAD_AFTER_HANDSHAKE:-true}
      # Signed handshake responses are optional. api_id/api_hash remain the primary
      # first-party client authentication mechanism.
      AEGIS_ProtocolSecurity__RequireSignedHandshakeResponses: ${AEGIS_REQUIRE_SIGNED_HANDSHAKE_RESPONSES:-false}
      AEGIS_ProtocolSecurity__RequireAppCredentials: ${AEGIS_REQUIRE_APP_CREDENTIALS:-true}
      AEGIS_ProtocolSecurity__HandshakeSigningPrivateKeyBase64: ${AEGIS_HANDSHAKE_SIGNING_PRIVATE_KEY_BASE64:-}
    ports:
      - "8888:8888"
      - "9091:9091"
    volumes:
      - aegis_media_data:/data/media
      - aegis_zonetree_data:/data/zonetree
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': > /dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  aegis-reencrypt-totp:
    build:
      context: .
      dockerfile: Dockerfile.build
    container_name: aegis-reencrypt-totp
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["dotnet", "run", "--project", "src/Aegis.Server/Aegis.Server.csproj", "--", "--reencrypt-totp-secrets"]
    environment:
      AEGIS_Database__Provider: PostgreSQL
      AEGIS_Database__ConnectionString: ${AEGIS_DB_CONNECTION_STRING}
      AEGIS_Redis__ConnectionString: ${AEGIS_REDIS_CONNECTION_STRING:-redis:6379}
      AEGIS_Minio__Enabled: "false"
      AEGIS_Elasticsearch__Enabled: "false"
      AEGIS_Security__TotpEncryptionKey: ${AEGIS_Security__TotpEncryptionKey}
    profiles:
      - migration

  aegis-botapi:
    build:
      context: .
      dockerfile: Dockerfile.botapi
    container_name: aegis-botapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aegis-server:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5000
      Database__Provider: PostgreSQL
      Database__ConnectionString: ${AEGIS_DB_CONNECTION_STRING}
      Redis__ConnectionString: ${AEGIS_REDIS_CONNECTION_STRING:-redis:6379}
      AvatarStorage__BaseDirectory: /data/media/avatars
      Elasticsearch__Enabled: ${AEGIS_ELASTICSEARCH_ENABLED:-true}
      Elasticsearch__Endpoint: ${AEGIS_ELASTICSEARCH_ENDPOINT:-http://elasticsearch:9200}
      Elasticsearch__IndexName: ${AEGIS_ELASTICSEARCH_INDEX:-aegis-users}
      Minio__Enabled: ${AEGIS_MINIO_ENABLED:-true}
      Minio__Endpoint: ${AEGIS_MINIO_ENDPOINT:-minio:9000}
      Minio__UseSsl: "false"
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Minio__Bucket: ${AEGIS_MINIO_BUCKET:-aegis-media}
      Minio__PublicBaseUrl: ${AEGIS_MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      Security__TotpEncryptionKey: ${AEGIS_Security__TotpEncryptionKey:-}
      ConnectionStrings__Default: ${AEGIS_DB_CONNECTION_STRING}
    ports:
      - "5000:5000"
    volumes:
      - aegis_media_data:/data/media
    healthcheck:
      test: ["CMD-SHELL", "bash -lc ': > /dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aegis_prometheus_data:/prometheus
    depends_on:
      aegis-server:
        condition: service_healthy
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aegis_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://95.215.56.43/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "3000:3000"
    volumes:
      - aegis_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  aegis_pg_data:
  aegis_redis_data:
  aegis_media_data:
  aegis_zonetree_data:
  aegis_minio_data:
  aegis_es_data:
  aegis_prometheus_data:
  aegis_grafana_data:
