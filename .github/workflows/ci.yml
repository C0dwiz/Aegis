name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./tests/Aegis.Tests/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  fuzz:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run protocol fuzz tests
      run: dotnet test tests/Aegis.Tests/Aegis.Tests.csproj --configuration Release --filter "Category=Fuzz" --verbosity normal

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Dependency vulnerability scan
      run: dotnet list AegisMessenger.Server.sln package --vulnerable --include-transitive

    - name: Secret scan (gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
